[project]
name = "neural-networks-from-zero"
version = "0.1.0"
description = "Hands-on Python, PyTorch and neural network learning notebooks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2",
  "torch>=2.5,<3", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8", "ipykernel>=6.29,<8", "jupyterlab>=4.2,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["support"]
packages = ["models"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
